body::before{content:"";position:fixed;inset:0;background:rgba(11,35,80,.78);z-index:-1}
.wrap{max-width:860px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:12px;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;gap:12px}
header img{height:56px;width:auto}
header h1{margin:0;font-weight:800;font-size:clamp(18px,4.5vw,26px);line-height:1.05;flex:1}
header h1 small{display:block;font-size:.6em;color:var(--oro);letter-spacing:.06em;text-transform:uppercase}
.prog{background:var(--lima);color:var(--navy);font-weight:800;border-radius:999px;padding:2px 12px;font-variant-numeric:tabular-nums}
.prog:empty{display:none}
.barra{height:8px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--oro),var(--lima));transition:width .3s}
.card{flex:1;background:var(--papel);color:var(--tinta);border:4px solid var(--navy);border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.35);padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:14px;animation:entra .3s ease both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.etq{align-self:flex-start;color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:3px 12px}
.item{font-weight:800;font-size:clamp(19px,4.6vw,28px);line-height:1.15;margin:0}
p{margin:0;font-size:17px;line-height:1.4;font-weight:600}
.escala{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:auto}
.op{--lc:#fff;font:inherit;cursor:pointer;border:3px solid color-mix(in srgb,var(--lc) 70%,var(--navy));background:color-mix(in srgb,var(--lc) 28%,#fff);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--navy);font-size:13px;line-height:1.1;font-weight:700;min-height:64px}
.op b{font-size:26px;line-height:1;color:color-mix(in srgb,var(--lc) 55%,var(--navy))}
.op[data-v="1"]{--lc:#e5484d}.op[data-v="2"]{--lc:#f5873b}.op[data-v="3"]{--lc:#f2c230}.op[data-v="4"]{--lc:#8bcf3a}.op[data-v="5"]{--lc:#2f9e44}
.op.sel{background:var(--lc);color:#fff;border-color:var(--navy);box-shadow:0 3px 0 var(--navy);transform:translateY(-2px)}
.op.sel b{color:#fff}.op[data-v="3"].sel,.op[data-v="3"].sel b{color:var(--navy)}
@media (max-width:520px){header img{height:38px}header h1{font-size:17px}.escala{grid-template-columns:1fr}.op{flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:6px 14px;font-size:15px}}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;font-size:18px;border:3px solid var(--navy);border-radius:14px;padding:8px 18px;min-height:48px;cursor:pointer;background:var(--lima);color:var(--navy);box-shadow:0 4px 0 var(--navy)}
.btn:disabled{background:#c9d3c0;color:#6b7a8f;cursor:not-allowed}
.btn.sec{background:#fff}
.btn:focus-visible,.op:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
label{font-weight:800;font-size:17px}
input,textarea{font:inherit;font-size:17px;font-weight:600;color:var(--tinta);background:#fff;border:3px solid var(--navy);border-radius:12px;padding:8px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
.fila{display:grid;grid-template-columns:1fr 130px;gap:10px}
.error{color:#b42318;font-weight:700;min-height:1.2em;font-size:15px}
.final{align-items:center;text-align:center;justify-content:center}
.estrella{font-size:90px;line-height:1;color:var(--oro);text-shadow:0 4px 0 var(--navy);animation:pop 1s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-180deg);opacity:0}to{transform:none;opacity:1}}
.nota{font-size:14px;color:#5d6f8f;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    var c = cola(); if(!c.length || !REGISTRO.url) return;
    fetch(REGISTRO.url, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(c) })
      .then(function(){ guardar("rams_cola", JSON.stringify(cola().slice(c.length))); }).catch(function(){});
  }
  window.addEventListener("online", enviar); setTimeout(enviar, 2000);

  function pintar(){
    var c = $("card"), h = "";
    $("prog").textContent = paso >= 0 && paso < N ? (paso+1) + "/" + N : "";
    $("barra").style.width = (paso < 0 ? 0 : Math.min(paso, N) / N * 100) + "%";
    if(paso === -3){
      h = '<div class="card final" style="border:0;box-shadow:none;padding:0"><span class="estrella">★</span><p class="item">¡Misión Bonus completada, '+esc(nombre.split(" ")[0])+'!</p><p>Alcanzaste el <b>Nivel Súper Experto</b> de Rumbo a un Mundo Sostenible. Gracias por compartir tu opinión: nos ayuda a mejorar la unidad.</p><p class="nota">Tus respuestas quedaron registradas. Ya puedes cerrar esta página.</p></div>';
    } else if(paso === -2){
      h = '<p class="item">Antes de empezar</p><p>Escribe tu nombre y apellido y tu curso.</p>'+
        '<div class="fila"><div><label for="nom">Nombre y apellido</label><input id="nom" autocomplete="off" autocapitalize="words" maxlength="40" value="'+esc(nombre)+'"></div>'+
        '<div><label for="cur">Curso</label><input id="cur" inputmode="numeric" maxlength="4" placeholder="1001" value="'+esc(curso)+'"></div></div>'+
        '<p class="error" id="err"></p><div class="nav"><span></span><button class="btn" id="sig" type="button">Continuar ▸</button></div>';
    } else if(paso === -1){
      h = '<span class="etq" style="background:#c98a12">Instrucciones</span><p class="item">Tu opinión es muy importante</p>'+
        '<p>Lee cada afirmación con atención y elige la opción que mejor represente tu grado de acuerdo, según esta escala: 1 = Totalmente en desacuerdo · 2 = En desacuerdo · 3 = Ni de acuerdo ni en desacuerdo · 4 = De acuerdo · 5 = Totalmente de acuerdo.</p>'+
        '<p><b>No hay respuestas correctas o incorrectas; responde con honestidad.</b> Esto no es una evaluación.</p>'+
        '<div class="nav"><button class="btn sec" id="atr" type="button">◂ Atrás</button><button class="btn" id="sig" type="button">Comenzar ▸</button></div>';
    } else if(paso < N){
      var it = items[paso], D = LIKERT.dimensiones[it.dim];
      h = '<span class="etq" style="background:'+D.color+'">Dimensión '+(it.dim+1)+'. '+D.nombre+'</span><p class="item">'+(paso+1)+'. '+it.txt+'</p>'+
        '<div class="escala">'+LIKERT.escala.map(function(e, i){ return '<button type="button" class="op'+(resp[paso]===i+1?' sel':'')+'" data-v="'+(i+1)+'"><b>'+(i+1)+'</b>'+e+'</button>'; }).join("")+'</div>'+
        '<div class="nav"><button class="btn sec" id="atr" type="button">◂ Atrás</button><button class="btn" id="sig" type="button"'+(resp[paso]?'':' disabled')+'>Siguiente ▸</button></div>';
    } else {
      h = '<p class="item">Preguntas abiertas (opcional)</p>'+LIKERT.abiertas.map(function(q, i){ return '<label for="ab'+i+'">'+(i+1)+'. '+q+'</label><textarea id="ab'+i+'" maxlength="500"></textarea>'; }).join("")+
        '<p class="error" id="err"></p><div class="nav"><button class="btn sec" id="atr" type="button">◂ Atrás</button><button class="btn" id="env" type="button">Enviar respuestas ▸</button></div>';
    }
    c.innerHTML = h; c.style.animation = "none"; void c.offsetWidth; c.style.animation = "";
    c.querySelectorAll(".op").forEach(function(b){ b.onclick = function(){
      resp[paso] = +b.dataset.v; guardar("rams_likert_borrador", JSON.stringify(resp));
      c.querySelectorAll(".op").forEach(function(x){ x.classList.toggle("sel", x === b); });
      $("sig").disabled = false; setTimeout(function(){ paso++; pintar(); }, 320);
    }; });
    if($("atr")) $("atr").onclick = function(){ paso--; pintar(); };
    if($("sig")) $("sig").onclick = function(){
      if(paso === -2){
        var n = $("nom").value.trim().replace(/\s+/g," "), cu = $("cur").value.replace(/\s+/g,"");
        if(n.length < 3){ $("err").textContent = "Escribe tu nombre y apellido."; return; }
        if(!/^\d{3,4}$/.test(cu)){ $("err").textContent = "Escribe tu curso, por ejemplo 1001."; return; }
        nombre = n; curso = cu; guardar("rams_nombre", n); guardar("rams_curso", cu);
      }
      paso++; pintar();
    };
    if($("env")) $("env").onclick = function(){
      var faltan = items.map(function(_, i){ return resp[i] ? 0 : i+1; }).filter(Boolean);
      if(faltan.length){ $("err").textContent = "Te faltan los ítems: " + faltan.join(", ") + ". Usa «Atrás» para responderlos."; return; }
      var lista = items.map(function(_, i){ return resp[i]; });
      var prom = LIKERT.dimensiones.map(function(d, di){ var s = 0, k = 0; items.forEach(function(it, i){ if(it.dim === di){ s += resp[i]; k++; } }); return Math.round(s / k * 100) / 100; });
      var d = { clave:REGISTRO.clave, t:new Date().toISOString(), nombre:nombre, curso:curso, parte:"Encuesta (archivo aparte)", mision:"", evento:"likert",
                detalle:"Cuestionario final", hojas:null, id:idDisp, likert:lista, promedios:prom, abiertas:[$("ab0").value.trim(), $("ab1").value.trim()] };
      var c2 = cola(); c2.push(d); guardar("rams_cola", JSON.stringify(c2)); enviar();
      var hoy = new Date(); guardar("rams_likert", hoy.getFullYear()+"-"+(hoy.getMonth()+1)+"-"+hoy.getDate()); guardar("rams_likert_borrador", "");
      paso = -3; pintar();
    };
  }
  pintar();
})();
</script>
</body>
</html>
